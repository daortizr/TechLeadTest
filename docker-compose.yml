version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flightuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flightpass}
      POSTGRES_DB: ${DB_NAME:-flights_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flightuser}"]
      interval: 5s
      retries: 10
      timeout: 5s
      start_period: 10s
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-flightuser}
      DB_PASSWORD: ${DB_PASSWORD:-flightpass}
      DB_NAME: ${DB_NAME:-flights_db}
      DATABASE_URL: postgresql://${DB_USER:-flightuser}:${DB_PASSWORD:-flightpass}@db:5432/${DB_NAME:-flights_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/airports || exit 1"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s
    ports:
      - "3000:3000"
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - app-network
    environment:
      ADMIN_KEY: ${ADMIN_KEY:-admin-secret-key}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge
